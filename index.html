<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOS Leadership Portal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .brutalist-shadow {
            shadow-offset: 6px 6px;
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        }

        .brutalist-shadow-sm {
            box-shadow: 3px 3px 0px 0px rgba(0,0,0,1);
        }

        .active-press:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 pb-24 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b-4 border-black p-6 sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none text-black">FOS</h1>
                    <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Leadership Portal</p>
                </div>
                <button onclick="toggleInfo(true)" class="text-slate-300 hover:text-black transition-colors">
                    <i data-lucide="info" class="w-5 h-5"></i>
                </button>
            </div>
            <button id="refreshBtn" onclick="fetchData()" class="p-2 border-2 border-black rounded-lg bg-white hover:bg-emerald-400 transition-colors brutalist-shadow-sm active-press">
                <i data-lucide="refresh-cw" id="refreshIcon" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pt-6">
        <!-- SUBMIT VIEW (Landing) -->
        <div id="askView" class="space-y-6">
            <div class="bg-white border-2 border-black p-6 rounded-3xl brutalist-shadow">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-12 h-12 bg-blue-500 rounded-2xl border-2 border-black flex items-center justify-center rotate-3 brutalist-shadow-sm text-white">
                        <i data-lucide="help-circle" class="w-6 h-6"></i>
                    </div>
                    <h2 class="text-2xl font-black tracking-tighter text-black uppercase">Post</h2>
                </div>
                
                <form id="postForm" class="space-y-5">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase tracking-widest ml-1 text-slate-500">Identity</label>
                        <input type="text" id="userInput" placeholder="Who are you? (Optional)" class="w-full border-2 border-black p-3 rounded-xl focus:bg-emerald-50 outline-none font-bold shadow-inner">
                    </div>

                    <div class="space-y-1">
                        <label id="q1Label" class="text-[10px] font-black uppercase tracking-widest ml-1 text-emerald-600 italic">Fetching Question 1...</label>
                        <textarea required id="q1Input" rows="2" placeholder="Tap to answer..." class="w-full border-2 border-black p-3 rounded-xl focus:bg-emerald-50 outline-none font-bold resize-none shadow-inner"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label id="q2Label" class="text-[10px] font-black uppercase tracking-widest ml-1 text-blue-600 italic">Fetching Question 2...</label>
                        <textarea required id="q2Input" rows="3" placeholder="Tap to answer..." class="w-full border-2 border-black p-3 rounded-xl focus:bg-blue-50 outline-none font-bold resize-none shadow-inner"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-black text-white font-black p-4 rounded-xl flex items-center justify-center gap-2 hover:bg-emerald-500 transition-all active-press">
                        <span id="btnText">PUBLISH RESPONSE</span>
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- FEED VIEW (Hidden by default) -->
        <div id="feedView" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-black uppercase tracking-tight flex items-center gap-2">
                    <i data-lucide="message-square" class="w-5 h-5 text-emerald-500"></i> Community Feed
                </h2>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse-soft"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Live</span>
                    <span id="countBadge" class="text-xs font-bold bg-black text-white px-2 py-1 rounded-full">0</span>
                </div>
            </div>
            
            <div id="feedContainer" class="space-y-5">
                <!-- Responses injected here -->
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-4 border-black p-4 pb-8 z-20">
        <div class="max-w-md mx-auto flex gap-4">
            <button onclick="switchView('feed')" id="navFeed" class="flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-slate-200 text-slate-400">
                <i data-lucide="message-square" class="w-5 h-5"></i>
                FEED
            </button>
            <button onclick="switchView('ask')" id="navAsk" class="flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-black bg-blue-400 brutalist-shadow-sm text-white">
                <i data-lucide="send" class="w-5 h-5"></i>
                SUBMIT
            </button>
        </div>
    </nav>

    <!-- Info Overlay -->
    <div id="infoOverlay" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white border-4 border-black p-8 rounded-[2rem] shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] max-w-sm w-full relative">
            <button onclick="toggleInfo(false)" class="absolute top-4 right-4 p-2 hover:bg-slate-100 rounded-full">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="w-16 h-16 bg-emerald-400 rounded-2xl border-4 border-black flex items-center justify-center mb-6 -rotate-6">
                <i data-lucide="info" class="text-black w-8 h-8"></i>
            </div>
            <h3 class="text-3xl font-black mb-4 uppercase italic tracking-tighter">How it works</h3>
            <div class="space-y-4 text-slate-600 font-bold text-sm leading-relaxed">
                <div class="flex gap-3">
                    <div class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs font-black">1</div>
                    <p>Answer the 2 leadership prompts in the <span class="text-blue-500 italic">Submit</span> tab.</p>
                </div>
                <div class="flex gap-3">
                    <div class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs font-black">2</div>
                    <p>Responses save instantly to the <span class="text-emerald-500 italic">FOS Leadership</span> Sheet.</p>
                </div>
                <div class="flex gap-3">
                    <div class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs font-black">3</div>
                    <p>The <span class="text-black italic underline">Feed</span> updates every minute automatically!</p>
                </div>
            </div>
            <button onclick="toggleInfo(false)" class="mt-8 w-full bg-black text-white p-4 rounded-xl font-black uppercase hover:bg-emerald-500 transition-colors">Got it!</button>
        </div>
    </div>

    <!-- Status Toast -->
    <div id="statusOverlay" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white border-4 border-black p-8 rounded-[2rem] text-center shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] max-w-xs w-full">
            <div id="statusIconBox" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center border-4 border-black">
                <i data-lucide="check-circle-2" id="statusIcon" class="text-black w-10 h-10"></i>
            </div>
            <h3 id="statusTitle" class="text-2xl font-black mb-2 uppercase italic tracking-tighter text-black">Confirmed!</h3>
            <p id="statusMsg" class="font-bold text-slate-500 text-sm">Response submitted!</p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyeEtVEbVp1h2XoclzIh3h6IjxzYU2dPyMx85H4WbpkskZJJj8FfWCzNtdKVrGCNKX4vw/exec";
        let questions = { q1: '...', q2: '...' };
        let currentView = 'ask';
        let refreshInterval;

        // Initialize
        window.onload = () => {
            lucide.createIcons();
            fetchData();
            startAutoRefresh();
        };

        function switchView(view) {
            currentView = view;
            const ask = document.getElementById('askView');
            const feed = document.getElementById('feedView');
            const navAsk = document.getElementById('navAsk');
            const navFeed = document.getElementById('navFeed');

            if (view === 'ask') {
                ask.classList.remove('hidden');
                feed.classList.add('hidden');
                navAsk.className = "flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-black bg-blue-400 brutalist-shadow-sm text-white";
                navFeed.className = "flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-slate-200 text-slate-400";
            } else {
                ask.classList.add('hidden');
                feed.classList.remove('hidden');
                navFeed.className = "flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-black bg-emerald-400 brutalist-shadow-sm text-black";
                navAsk.className = "flex-1 p-3 rounded-2xl font-black flex items-center justify-center gap-2 transition-all border-2 border-slate-200 text-slate-400";
                fetchData(true);
            }
            lucide.createIcons();
        }

        async function fetchData(silent = false) {
            const icon = document.getElementById('refreshIcon');
            if (!silent) icon.classList.add('animate-spin');

            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();

                if (data.questions) {
                    questions = data.questions;
                    document.getElementById('q1Label').textContent = questions.q1;
                    document.getElementById('q2Label').textContent = questions.q2;
                }

                if (data.responses) {
                    renderFeed(data.responses);
                    document.getElementById('countBadge').textContent = data.responses.length;
                }
            } catch (err) {
                console.error(err);
            } finally {
                icon.classList.remove('animate-spin');
            }
        }

        function renderFeed(responses) {
            const container = document.getElementById('feedContainer');
            if (responses.length === 0) {
                container.innerHTML = `<div class="p-12 text-center border-4 border-dashed border-slate-300 rounded-3xl"><p class="text-slate-400 font-bold">The feed is quiet. Start the conversation!</p></div>`;
                return;
            }

            container.innerHTML = responses.map(resp => `
                <div class="bg-white border-2 border-black p-5 rounded-2xl brutalist-shadow">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-emerald-100 rounded-full border-2 border-black flex items-center justify-center">
                                <i data-lucide="user" class="w-4 h-4 text-emerald-700"></i>
                            </div>
                            <span class="text-sm font-black tracking-tight">${resp.User || 'Anonymous'}</span>
                        </div>
                        <span class="text-[10px] font-mono font-bold text-slate-400">${resp.Timestamp ? new Date(resp.Timestamp).toLocaleDateString() : 'Recent'}</span>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <p class="text-[9px] font-black text-emerald-600 uppercase mb-1 tracking-widest">${questions.q1}</p>
                            <p class="font-bold text-base leading-snug text-slate-800">${resp.Question1}</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <p class="text-[9px] font-black text-blue-600 uppercase mb-1 tracking-widest">${questions.q2}</p>
                            <p class="text-sm font-medium text-slate-700 italic">"${resp.Question2}"</p>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        document.getElementById('postForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            btnText.textContent = "SENDING...";

            const payload = {
                user: document.getElementById('userInput').value,
                q1: document.getElementById('q1Input').value,
                q2: document.getElementById('q2Input').value
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                showStatus('success', 'Response submitted!');
                document.getElementById('q1Input').value = '';
                document.getElementById('q2Input').value = '';
                
                setTimeout(() => {
                    hideStatus();
                    switchView('feed');
                }, 1500);
            } catch (err) {
                showStatus('error', 'Failed to send.');
                setTimeout(hideStatus, 2000);
            } finally {
                btn.disabled = false;
                btnText.textContent = "PUBLISH RESPONSE";
            }
        };

        function showStatus(type, msg) {
            const overlay = document.getElementById('statusOverlay');
            const iconBox = document.getElementById('statusIconBox');
            const title = document.getElementById('statusTitle');
            const text = document.getElementById('statusMsg');

            title.textContent = type === 'success' ? 'Confirmed!' : 'Error';
            text.textContent = msg;
            iconBox.className = `w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center border-4 border-black ${type === 'success' ? 'bg-emerald-400' : 'bg-red-400'}`;
            
            overlay.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusOverlay').classList.add('hidden');
        }

        function toggleInfo(show) {
            document.getElementById('infoOverlay').classList.toggle('hidden', !show);
        }

        function startAutoRefresh() {
            setInterval(() => {
                if (currentView === 'feed') {
                    fetchData(true);
                }
            }, 60000);
        }
    </script>
</body>
</html>
